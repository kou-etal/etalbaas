---
# EtalBaaS Post-Install Bootstrap
#
# Run after kubespray cluster.yml completes.
# Installs: Sealed Secrets → ArgoCD → Root Application → Cloudflare DNS → Tailscale
#
# Usage:
#   ansible-playbook playbooks/bootstrap.yml -i <inventory>
#
# Prerequisites:
#   - kubeconfig accessible (~/.kube/config or KUBECONFIG env)
#   - group_vars/all/vault.yml encrypted with ansible-vault
#   - .vault-password file present

- name: EtalBaaS Platform Bootstrap
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../group_vars/all/vault.yml
    - ../group_vars/all/main.yml

  vars:
    platform_namespace: "platform-system"

  roles:
    - role: sealed-secrets
      tags: [sealed-secrets]

    - role: argocd
      tags: [argocd]

    - role: bootstrap-apps
      tags: [bootstrap-apps]

    - role: cloudflare-dns
      tags: [cloudflare-dns]

# --- Tailscale on VPS nodes (requires -i <kubespray inventory>) ---
- name: Install Tailscale on cluster nodes
  hosts: kube_control_plane
  become: true
  gather_facts: false
  tags: [tailscale]

  vars_files:
    - ../group_vars/all/vault.yml
    - ../group_vars/all/main.yml

  roles:
    - role: tailscale
      when: tailscale_auth_key is defined and tailscale_auth_key | length > 0
    - role: dnat-ingress
      tags: [dnat-ingress]
