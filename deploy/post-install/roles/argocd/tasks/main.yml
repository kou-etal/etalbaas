---
- name: Create ArgoCD namespace
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ argocd_namespace }}"

- name: Add Argo Helm repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm

- name: Install ArgoCD via Helm
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: false
    wait: true
    timeout: "10m0s"
    values: "{{ lookup('template', 'argocd-values.yaml.j2') | from_yaml }}"

- name: Create OCI repository secret for envoy-gateway
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: envoyproxy-oci-repo
        namespace: "{{ argocd_namespace }}"
        labels:
          argocd.argoproj.io/secret-type: repository
      type: Opaque
      stringData:
        type: helm
        name: envoyproxy
        url: docker.io/envoyproxy
        enableOCI: "true"

- name: Wait for ArgoCD server to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: argocd-server
    namespace: "{{ argocd_namespace }}"
  register: argocd_server
  until: >-
    (argocd_server.resources | default([])) | length > 0 and
    (argocd_server.resources | default([]))[0].status.readyReplicas | default(0) >= 1
  retries: 60
  delay: 10
