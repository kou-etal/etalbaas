apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gotrue
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/kou-etal/etalbaas
    targetRevision: HEAD
    path: deploy/helm/gotrue
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
