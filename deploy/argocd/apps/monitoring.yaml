apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: v67.9.0
    helm:
      values: |
        grafana:
          enabled: true
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki.monitoring.svc:3100
              access: proxy
              jsonData:
                derivedFields:
                  - datasourceUid: tempo
                    matcherRegex: '"trace_id":"([a-f0-9]+)"'
                    name: TraceID
                    url: "$${__value.raw}"
            - name: Tempo
              type: tempo
              uid: tempo
              url: http://tempo.monitoring.svc:3100
              access: proxy
              jsonData:
                tracesToLogs:
                  datasourceUid: loki
                  filterByTraceID: true
                  mapTagNamesEnabled: true
                  mappedTags:
                    - key: service
                      value: service
                serviceMap:
                  datasourceUid: prometheus
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
        alertmanager:
          config:
            route:
              receiver: discord-default
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                - match:
                    severity: critical
                  receiver: discord-critical
                  repeat_interval: 1h
            receivers:
              - name: discord-default
                webhook_configs:
                  - url: http://alertmanager-discord.monitoring.svc:9094
              - name: discord-critical
                webhook_configs:
                  - url: http://alertmanager-discord.monitoring.svc:9094
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
