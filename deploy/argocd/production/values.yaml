# Production environment overrides for EtalBaaS Helm chart.
# This file is referenced by deploy/argocd/apps/etalbaas.yaml.
# Values here merge with (and override) deploy/helm/etalbaas/values.yaml.

global:
  baseDomain: "etalbaas.example.com"        # TODO: Replace with actual domain
  environment: "production"
  imageRegistry: "ghcr.io/kou-etal"
  imagePullSecrets:
    - name: ghcr-pull-secret

services:
  common:
    replicaCount: 2

  tenantUser:
    replicaCount: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  project:
    replicaCount: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  function:
    replicaCount: 2
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

  event:
    replicaCount: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  storage:
    enabled: false                            # TODO: Enable after S3/R2 setup
    replicaCount: 2
    s3:
      endpoint: ""                            # TODO: Replace with R2/MinIO endpoint
      bucket: "etalbaas-storage"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

certManager:
  issuer:
    email: "admin@etalbaas.example.com"       # TODO: Replace with actual email

metadb:
  internal:
    instances: 3
    storage: 20Gi
    backup:
      enabled: false                          # TODO: Enable after R2 setup + r2-backup-creds secret
      endpoint: ""                            # TODO: Replace with R2/S3 endpoint
      bucket: "etalbaas-backups"
      credentialsSecret: "r2-backup-creds"
      schedule: "0 2 * * *"
      retentionDays: 30

auth:
  jwt:
    # Production: use the actual GoTrue service name (not gotrue-dev)
    jwksUri: "http://gotrue.platform-system.svc:9999/.well-known/jwks.json"  # TODO: Replace namespace if different
    issuer: "https://auth.etalbaas.example.com"  # TODO: Must match GoTrue API_EXTERNAL_URL
    audiences:
      - "authenticated"

gotrue:
  externalUrl: "https://auth.etalbaas.example.com"    # TODO: Replace
  siteUrl: "https://dashboard.etalbaas.example.com"   # TODO: Replace
  jwt:
    useAsymmetric: false                              # Phase 1: symmetric JWT
