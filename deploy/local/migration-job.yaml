---
# ConfigMap with migration SQL
apiVersion: v1
kind: ConfigMap
metadata:
  name: meta-db-migrations
  namespace: etalbaas
data:
  000001_initial.up.sql: |
    BEGIN;

    CREATE OR REPLACE FUNCTION update_updated_at()
    RETURNS TRIGGER AS $$
    BEGIN
      NEW.updated_at = now();
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    CREATE TABLE IF NOT EXISTS tenants (
        id            uuid        PRIMARY KEY,
        email         text        NOT NULL UNIQUE,
        display_name  text        NOT NULL,
        avatar_url    text,
        plan          text        NOT NULL DEFAULT 'free',
        status        text        NOT NULL DEFAULT 'active',
        created_at    timestamptz NOT NULL DEFAULT now(),
        updated_at    timestamptz NOT NULL DEFAULT now(),
        CONSTRAINT tenants_plan_check          CHECK (plan IN ('free', 'pro', 'enterprise')),
        CONSTRAINT tenants_status_check        CHECK (status IN ('active', 'suspended', 'deleted')),
        CONSTRAINT tenants_display_name_length CHECK (length(display_name) <= 100),
        CONSTRAINT tenants_email_length        CHECK (length(email) <= 254),
        CONSTRAINT tenants_avatar_url_length   CHECK (length(avatar_url) <= 2048)
    );

    CREATE TRIGGER tenants_updated_at
        BEFORE UPDATE ON tenants
        FOR EACH ROW EXECUTE FUNCTION update_updated_at();

    CREATE TABLE IF NOT EXISTS projects (
        id                  text        PRIMARY KEY,
        tenant_id           uuid        NOT NULL REFERENCES tenants(id),
        display_name        text        NOT NULL,
        description         text        DEFAULT '',
        status              text        NOT NULL DEFAULT 'pending',
        postgres_enabled    boolean     NOT NULL DEFAULT true,
        postgres_extensions text[]      DEFAULT '{pgvector,pgcrypto}',
        redis_enabled       boolean     NOT NULL DEFAULT false,
        postgrest_enabled   boolean     NOT NULL DEFAULT false,
        created_at          timestamptz NOT NULL DEFAULT now(),
        updated_at          timestamptz NOT NULL DEFAULT now(),
        CONSTRAINT projects_status_check          CHECK (status IN ('pending', 'provisioning', 'ready', 'paused', 'failed', 'deleted')),
        CONSTRAINT projects_postgrest_check       CHECK (NOT (postgrest_enabled AND NOT postgres_enabled)),
        CONSTRAINT projects_display_name_length   CHECK (length(display_name) <= 100),
        CONSTRAINT projects_description_length    CHECK (length(description) <= 500)
    );

    CREATE INDEX IF NOT EXISTS idx_projects_tenant_id ON projects(tenant_id);
    CREATE INDEX IF NOT EXISTS idx_projects_status    ON projects(status) WHERE status != 'deleted';

    CREATE TRIGGER projects_updated_at
        BEFORE UPDATE ON projects
        FOR EACH ROW EXECUTE FUNCTION update_updated_at();

    CREATE TABLE IF NOT EXISTS api_keys (
        id          uuid        PRIMARY KEY,
        project_id  text        NOT NULL REFERENCES projects(id),
        name        text        NOT NULL,
        key_hash    text        NOT NULL,
        key_prefix  text        NOT NULL,
        role        text        NOT NULL,
        expires_at  timestamptz,
        revoked_at  timestamptz,
        created_at  timestamptz NOT NULL DEFAULT now(),
        CONSTRAINT api_keys_role_check           CHECK (role IN ('anon', 'service_role')),
        CONSTRAINT api_keys_name_length          CHECK (length(name) <= 63),
        CONSTRAINT api_keys_project_name_unique  UNIQUE (project_id, name)
    );

    CREATE INDEX IF NOT EXISTS idx_api_keys_key_hash   ON api_keys(key_hash) WHERE revoked_at IS NULL;
    CREATE INDEX IF NOT EXISTS idx_api_keys_project_id ON api_keys(project_id);

    CREATE TABLE IF NOT EXISTS functions (
        id                    uuid        PRIMARY KEY,
        project_id            text        NOT NULL REFERENCES projects(id),
        name                  text        NOT NULL,
        display_name          text        NOT NULL,
        kind                  text        NOT NULL,
        mode                  text        NOT NULL DEFAULT 'sync',
        source_type           text        NOT NULL DEFAULT 'inline',
        source_config         jsonb       DEFAULT '{}',
        source_storage_path   text,
        runtime_preset        text,
        runtime_requirements  text[]      DEFAULT '{}',
        runtime_dockerfile    text,
        timeout_sec           integer     NOT NULL DEFAULT 30,
        gpu_config            jsonb,
        triggers              jsonb       NOT NULL DEFAULT '[]',
        env_vars              jsonb       NOT NULL DEFAULT '{}',
        status                text        NOT NULL DEFAULT 'pending',
        build_image_ref       text,
        build_image_digest    text,
        build_duration_sec    integer,
        last_built_at         timestamptz,
        created_at            timestamptz NOT NULL DEFAULT now(),
        updated_at            timestamptz NOT NULL DEFAULT now(),
        CONSTRAINT functions_kind_check            CHECK (kind IN ('heavy-job', 'heavy-deployment', 'light-deployment')),
        CONSTRAINT functions_mode_check            CHECK (mode IN ('sync', 'async', 'stream')),
        CONSTRAINT functions_source_type_check     CHECK (source_type IN ('git', 'zip', 'inline')),
        CONSTRAINT functions_status_check          CHECK (status IN ('pending', 'building', 'ready', 'failed', 'deleted')),
        CONSTRAINT functions_runtime_check         CHECK (
            (runtime_preset IS NULL AND runtime_dockerfile IS NOT NULL)
            OR (runtime_preset IS NOT NULL AND runtime_dockerfile IS NULL)
        ),
        CONSTRAINT functions_name_length           CHECK (length(name) <= 40),
        CONSTRAINT functions_display_name_length   CHECK (length(display_name) <= 100),
        CONSTRAINT functions_project_name_unique   UNIQUE (project_id, name)
    );

    CREATE INDEX IF NOT EXISTS idx_functions_project_id ON functions(project_id);

    CREATE TRIGGER functions_updated_at
        BEFORE UPDATE ON functions
        FOR EACH ROW EXECUTE FUNCTION update_updated_at();

    CREATE TABLE IF NOT EXISTS invocations (
        id                uuid        PRIMARY KEY,
        function_id       uuid        NOT NULL REFERENCES functions(id),
        project_id        text        NOT NULL,
        trigger_type      text        NOT NULL,
        mode              text        NOT NULL,
        status            text        NOT NULL DEFAULT 'pending',
        error_message     text,
        duration_ms       integer,
        gpu_provider      text,
        gpu_type          text,
        gpu_duration_ms   integer,
        cold_start_ms     integer,
        memory_peak_bytes bigint,
        cpu_millis        bigint,
        retry_count       integer     NOT NULL DEFAULT 0,
        trace_id          text,
        started_at        timestamptz,
        completed_at      timestamptz,
        created_at        timestamptz NOT NULL DEFAULT now(),
        CONSTRAINT invocations_trigger_type_check    CHECK (trigger_type IN ('http', 'database_change', 'object_storage')),
        CONSTRAINT invocations_mode_check            CHECK (mode IN ('sync', 'async', 'stream')),
        CONSTRAINT invocations_status_check          CHECK (status IN ('pending', 'running', 'succeeded', 'failed', 'timeout', 'cancelled')),
        CONSTRAINT invocations_error_message_length  CHECK (length(error_message) <= 1024)
    );

    CREATE INDEX IF NOT EXISTS idx_invocations_project_created  ON invocations(project_id, created_at DESC);
    CREATE INDEX IF NOT EXISTS idx_invocations_function_created ON invocations(function_id, created_at DESC);

    CREATE TABLE IF NOT EXISTS event_history (
        id             uuid        PRIMARY KEY,
        project_id     text        NOT NULL,
        function_id    uuid        NOT NULL REFERENCES functions(id),
        invocation_id  uuid        REFERENCES invocations(id),
        trigger_type   text        NOT NULL,
        trigger_data   jsonb       NOT NULL DEFAULT '{}',
        status         text        NOT NULL DEFAULT 'received',
        attempt_count  integer     NOT NULL DEFAULT 1,
        last_error     text,
        trace_id       text,
        created_at     timestamptz NOT NULL DEFAULT now(),
        CONSTRAINT event_history_trigger_type_check  CHECK (trigger_type IN ('database_change', 'object_storage')),
        CONSTRAINT event_history_status_check        CHECK (status IN ('received', 'delivered', 'retrying', 'failed')),
        CONSTRAINT event_history_last_error_length   CHECK (length(last_error) <= 1024)
    );

    CREATE INDEX IF NOT EXISTS idx_event_history_project_created ON event_history(project_id, created_at DESC);
    CREATE INDEX IF NOT EXISTS idx_event_history_invocation      ON event_history(invocation_id) WHERE invocation_id IS NOT NULL;

    CREATE TABLE IF NOT EXISTS usage_daily (
        id                   uuid        PRIMARY KEY,
        project_id           text        NOT NULL REFERENCES projects(id),
        date                 date        NOT NULL,
        cpu_seconds          bigint      NOT NULL DEFAULT 0,
        memory_mb_seconds    bigint      NOT NULL DEFAULT 0,
        storage_bytes        bigint      NOT NULL DEFAULT 0,
        function_invocations bigint      NOT NULL DEFAULT 0,
        egress_bytes         bigint      NOT NULL DEFAULT 0,
        db_size_bytes        bigint      NOT NULL DEFAULT 0,
        created_at           timestamptz NOT NULL DEFAULT now(),
        CONSTRAINT usage_daily_project_date_unique UNIQUE (project_id, date)
    );

    CREATE TABLE IF NOT EXISTS platform_events (
        id          uuid        PRIMARY KEY,
        tenant_id   uuid        NOT NULL,
        project_id  text        NOT NULL,
        event_type  text        NOT NULL,
        payload     jsonb       NOT NULL DEFAULT '{}',
        created_at  timestamptz NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS idx_platform_events_tenant_created  ON platform_events(tenant_id, created_at DESC);
    CREATE INDEX IF NOT EXISTS idx_platform_events_project_created ON platform_events(project_id, created_at DESC);

    CREATE TABLE IF NOT EXISTS secrets_metadata (
        id          uuid        PRIMARY KEY,
        project_id  text        NOT NULL REFERENCES projects(id),
        name        text        NOT NULL,
        description text        NOT NULL DEFAULT '',
        created_at  timestamptz NOT NULL DEFAULT now(),
        updated_at  timestamptz NOT NULL DEFAULT now(),
        CONSTRAINT secrets_metadata_name_length          CHECK (length(name) <= 64),
        CONSTRAINT secrets_metadata_description_length   CHECK (length(description) <= 1024),
        CONSTRAINT secrets_metadata_project_name_unique  UNIQUE (project_id, name)
    );

    CREATE TRIGGER secrets_metadata_updated_at
        BEFORE UPDATE ON secrets_metadata
        FOR EACH ROW EXECUTE FUNCTION update_updated_at();

    -- GoTrue auth schema (minimal for dev)
    CREATE SCHEMA IF NOT EXISTS auth;

    CREATE TABLE IF NOT EXISTS auth.users (
        id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        instance_id uuid,
        aud text,
        role text,
        email text UNIQUE,
        encrypted_password text,
        email_confirmed_at timestamptz,
        confirmation_token text,
        confirmation_sent_at timestamptz,
        recovery_token text,
        recovery_sent_at timestamptz,
        email_change_token_new text,
        email_change text,
        email_change_sent_at timestamptz,
        last_sign_in_at timestamptz,
        raw_app_meta_data jsonb DEFAULT '{}',
        raw_user_meta_data jsonb DEFAULT '{}',
        is_super_admin boolean DEFAULT false,
        created_at timestamptz DEFAULT now(),
        updated_at timestamptz DEFAULT now(),
        phone text,
        phone_confirmed_at timestamptz,
        phone_change text,
        phone_change_token text,
        phone_change_sent_at timestamptz,
        email_change_token_current text,
        email_change_confirm_status smallint DEFAULT 0,
        banned_until timestamptz,
        reauthentication_token text,
        reauthentication_sent_at timestamptz,
        is_sso_user boolean DEFAULT false,
        deleted_at timestamptz
    );

    CREATE TABLE IF NOT EXISTS auth.refresh_tokens (
        id bigserial PRIMARY KEY,
        token text UNIQUE,
        user_id uuid REFERENCES auth.users(id) ON DELETE CASCADE,
        parent text,
        revoked boolean DEFAULT false,
        created_at timestamptz DEFAULT now(),
        updated_at timestamptz DEFAULT now(),
        session_id uuid
    );

    CREATE TABLE IF NOT EXISTS auth.sessions (
        id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id uuid REFERENCES auth.users(id) ON DELETE CASCADE,
        created_at timestamptz DEFAULT now(),
        updated_at timestamptz DEFAULT now(),
        factor_id uuid,
        aal text,
        not_after timestamptz,
        refreshed_at timestamptz,
        user_agent text,
        ip inet,
        tag text
    );

    CREATE INDEX IF NOT EXISTS idx_auth_sessions_user_id ON auth.sessions(user_id);
    CREATE INDEX IF NOT EXISTS idx_auth_refresh_tokens_session_id ON auth.refresh_tokens(session_id);

    -- Storage schema for storage service
    CREATE SCHEMA IF NOT EXISTS storage;

    CREATE TABLE IF NOT EXISTS storage.buckets (
        id TEXT PRIMARY KEY,
        name TEXT NOT NULL,
        project_id TEXT NOT NULL,
        access_level TEXT NOT NULL DEFAULT 'protected',
        file_size_limit BIGINT,
        allowed_mime_types TEXT[],
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        UNIQUE(project_id, name)
    );

    CREATE TABLE IF NOT EXISTS storage.objects (
        id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
        bucket_id TEXT NOT NULL REFERENCES storage.buckets(id) ON DELETE CASCADE,
        name TEXT NOT NULL,
        owner UUID,
        size BIGINT,
        mime_type TEXT,
        etag TEXT,
        metadata JSONB DEFAULT '{}',
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        UNIQUE(bucket_id, name)
    );

    COMMIT;
---
# Migration Job
apiVersion: batch/v1
kind: Job
metadata:
  name: meta-db-migration
  namespace: etalbaas
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: migrate/migrate:latest
          command: ["migrate"]
          args:
            - "-path=/migrations"
            - "-database"
            - "postgres://etalbaas:etalbaas@postgres.etalbaas.svc:5432/etalbaas_meta?sslmode=disable"
            - "up"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: meta-db-migrations
