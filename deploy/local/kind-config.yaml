kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: etalbaas
nodes:
  - role: control-plane
    extraPortMappings:
      # Envoy Gateway HTTP
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      # Envoy Gateway HTTPS
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
