---
apiVersion: v1
kind: Namespace
metadata:
  name: etalbaas
---
# Platform secrets (JWT_SECRET, DATABASE_URL, S3 keys)
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: etalbaas
type: Opaque
stringData:
  JWT_SECRET: "super-secret-jwt-token-for-local-dev-minimum-32-chars!!"
  DATABASE_URL: "postgres://etalbaas:etalbaas@postgres.etalbaas.svc:5432/etalbaas_meta?sslmode=disable"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"
---
# PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: etalbaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "etalbaas"
            - name: POSTGRES_PASSWORD
              value: "etalbaas"
            - name: POSTGRES_DB
              value: "etalbaas_meta"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: pgdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: etalbaas
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
# NATS with JetStream
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: etalbaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2-alpine
          args: ["--jetstream", "-m", "8222"]
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: etalbaas
spec:
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
  selector:
    app: nats
---
# MinIO (S3-compatible)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: etalbaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              value: "minioadmin"
            - name: MINIO_ROOT_PASSWORD
              value: "minioadmin"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: etalbaas
spec:
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  selector:
    app: minio
