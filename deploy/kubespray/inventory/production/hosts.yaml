---
# EtalBaaS Production Cluster - 3 Node Topology
#
# node-01, node-02: Control Plane + Worker (all workloads)
# node-03: Control Plane + etcd only (NoSchedule taint, etcd quorum voter)
#
# Update ansible_host with actual VPS IPs before running kubespray.

all:
  children:
    kube_control_plane:
      hosts:
        node-01:
          ansible_host: 203.0.113.10
        node-02:
          ansible_host: 203.0.113.11
        node-03:
          ansible_host: 203.0.113.12
    kube_node:
      hosts:
        node-01: {}
        node-02: {}
        # node-03 is NOT a worker - etcd voter only
    etcd:
      hosts:
        node-01: {}
        node-02: {}
        node-03: {}
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: "~/.ssh/xserver_rsa"
    ansible_python_interpreter: /usr/bin/python3
