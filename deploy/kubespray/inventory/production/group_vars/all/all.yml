---
# EtalBaaS - kubespray common variables

# Timezone
timezone: Asia/Tokyo

# DNS
upstream_dns_servers:
  - 1.1.1.1
  - 8.8.8.8

# NTP
ntp_enabled: true
ntp_manage_config: true
ntp_servers:
  - ntp.nict.jp
  - ntp.jst.mfeed.ad.jp

# Disable swap
disable_swap: true

# SSH hardening (kubespray handles basic SSH, admin IP restriction is via firewall)
# Additional SSH hardening can be applied via separate role if needed.
