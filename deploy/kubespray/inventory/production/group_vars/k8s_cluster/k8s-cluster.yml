---
# EtalBaaS - Kubernetes cluster configuration

# Kubernetes version (kubespray v2.25.0 supports up to v1.29.x)
kube_version: v1.29.5

# Container runtime
container_manager: containerd

# CNI: Cilium with WireGuard transparent encryption
kube_network_plugin: cilium
cilium_version: "v1.15.4"
cilium_encryption_enabled: true
cilium_encryption_type: wireguard
cilium_hubble_enabled: true
cilium_hubble_relay_enabled: true

# kube-vip: Control Plane VIP + Service LoadBalancer (ARP mode)
kube_vip_enabled: true
kube_vip_controlplane_enabled: true
kube_vip_address: "162.43.46.85"
kube_vip_services_enabled: true
kube_vip_arp_enabled: true

# Local Path Provisioner (NVMe SSD storage for PVCs)
local_path_provisioner_enabled: true
local_path_provisioner_is_default_storageclass: true

# etcd encryption at rest (AES-GCM)
kube_encrypt_secret_data: true

# Kubernetes audit logging
kubernetes_audit: true
audit_log_maxage: 30
audit_log_maxbackup: 10
audit_log_maxsize: 100

# Pod Security Standards (baseline enforcement)
kube_pod_security_use_default: true

# Additional API server SANs (for external kubectl access)
supplementary_addresses_in_ssl_keys:
  - "162.43.46.85"

# kubelet resource reservation (prevent system OOM)
kubelet_system_reserved: true
kubelet_system_reserved_cpu: 100m
kubelet_system_reserved_memory: 256Mi
kubelet_system_reserved_ephemeral_storage: 1Gi

# Eviction thresholds
kubelet_eviction_hard:
  memory.available: "100Mi"
  nodefs.available: "10%"
  imagefs.available: "15%"

# kube-proxy
kube_proxy_mode: ipvs
kube_proxy_strict_arp: true
