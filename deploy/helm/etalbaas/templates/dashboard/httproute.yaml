{{- if and .Values.dashboard.enabled .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard
  namespace: {{ include "etalbaas.namespace" . }}
  labels:
    {{- include "etalbaas.serviceLabels" (dict "root" . "component" "dashboard") | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.operator.config.gatewayName | default "etalbaas-gateway" }}
      namespace: {{ .Values.operator.config.gatewayNamespace | default (include "etalbaas.namespace" .) }}
      sectionName: https
  hostnames:
    - "app.{{ .Values.global.baseDomain }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dashboard
          port: 8080
{{- end }}
