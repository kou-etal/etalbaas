{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: {{ include "etalbaas.namespace" . }}
  labels:
    {{- include "etalbaas.serviceLabels" (dict "root" . "component" "dashboard") | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
      {{- include "etalbaas.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/component: dashboard
        {{- include "etalbaas.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "etalbaas.podSecurityContext" . | nindent 8 }}
      containers:
        - name: dashboard
          image: {{ .Values.dashboard.image.repository | default (printf "%s/etalbaas-dashboard" .Values.global.imageRegistry) }}:{{ .Values.dashboard.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.{{ .Values.global.baseDomain }}"
            - name: NEXT_PUBLIC_GOTRUE_URL
              value: "https://auth.{{ .Values.global.baseDomain }}"
          securityContext:
            {{- include "etalbaas.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml (.Values.dashboard.resources | default dict) | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
{{- end }}
