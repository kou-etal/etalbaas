{{- if and (eq .Values.metadb.mode "internal") .Values.metadb.internal.pooler.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: meta-db-pooler
  namespace: {{ include "etalbaas.namespace" . }}
  labels:
    {{- include "etalbaas.labels" . | nindent 4 }}
    app.kubernetes.io/component: meta-db-pooler
spec:
  cluster:
    name: meta-db
  instances: {{ .Values.metadb.internal.pooler.instances }}
  type: rw
  pgbouncer:
    poolMode: {{ .Values.metadb.internal.pooler.poolMode }}
    parameters:
      max_client_conn: "100"
      default_pool_size: "20"
{{- end }}
