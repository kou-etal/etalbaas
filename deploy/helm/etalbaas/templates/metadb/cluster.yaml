{{- if eq .Values.metadb.mode "internal" }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: meta-db
  namespace: {{ include "etalbaas.namespace" . }}
  labels:
    {{- include "etalbaas.labels" . | nindent 4 }}
    app.kubernetes.io/component: meta-db
spec:
  instances: {{ .Values.metadb.internal.instances }}

  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
      wal_level: "logical"
      max_replication_slots: "10"
      max_wal_senders: "10"
    pg_hba:
      - hostssl all all 10.0.0.0/8 scram-sha-256

  storage:
    size: {{ .Values.metadb.internal.storage }}
    {{- if .Values.metadb.internal.storageClass }}
    storageClass: {{ .Values.metadb.internal.storageClass }}
    {{- end }}

  resources:
    {{- toYaml .Values.metadb.internal.resources | nindent 4 }}

  enableSuperuserAccess: true
  superuserSecret:
    name: meta-db-superuser

  {{- if .Values.metadb.internal.backup.enabled }}
  backup:
    barmanObjectStore:
      destinationPath: "s3://{{ .Values.metadb.internal.backup.bucket }}/platform/"
      {{- if .Values.metadb.internal.backup.endpoint }}
      endpointURL: {{ .Values.metadb.internal.backup.endpoint | quote }}
      {{- end }}
      {{- if .Values.metadb.internal.backup.region }}
      s3Region: {{ .Values.metadb.internal.backup.region | quote }}
      {{- end }}
      s3Credentials:
        accessKeyId:
          name: {{ .Values.metadb.internal.backup.credentialsSecret }}
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: {{ .Values.metadb.internal.backup.credentialsSecret }}
          key: SECRET_ACCESS_KEY
    retentionPolicy: "{{ .Values.metadb.internal.backup.retentionDays }}d"
  {{- end }}
{{- end }}
