{{- if and (eq .Values.metadb.mode "internal") .Values.metadb.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: meta-db-migration
  namespace: {{ include "etalbaas.namespace" . }}
  labels:
    {{- include "etalbaas.labels" . | nindent 4 }}
    app.kubernetes.io/component: meta-db-migration
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: meta-db-migration
        {{- include "etalbaas.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- include "etalbaas.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ .Values.metadb.migration.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              migrate -path=/migrations -database="${DATABASE_URL}?search_path=public" up
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metadb.appSecretName | default "meta-db-app" }}
                  key: uri
          securityContext:
            {{- include "etalbaas.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: meta-db-migrations
{{- end }}
