{{- if .Values.gateway.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-proxy-config
  namespace: envoy-gateway-system
  labels:
    {{- include "etalbaas.labels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: {{ .Values.gateway.serviceType | default "NodePort" }}
        {{- if eq ((.Values.gateway.serviceType | default "NodePort")) "NodePort" }}
        # Fixed NodePorts prevent DNAT rule breakage on service recreation.
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  nodePort: {{ .Values.gateway.nodePorts.http | default 30080 }}
                - name: https-443
                  nodePort: {{ .Values.gateway.nodePorts.https | default 30443 }}
                - name: tls-5432
                  nodePort: {{ .Values.gateway.nodePorts.postgres | default 30432 }}
        {{- end }}
{{- end }}
