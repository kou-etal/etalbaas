{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: etalbaas-dashboard-routes
  namespace: {{ include "etalbaas.namespace" . }}
  labels:
    {{- include "etalbaas.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: etalbaas-gateway
      namespace: {{ include "etalbaas.namespace" . }}
      sectionName: https-api
  hostnames:
    - "api.{{ include "etalbaas.baseDomain" . }}"
  rules:
    # Tenant-User Service
    - matches:
        - path:
            type: PathPrefix
            value: /etalbaas.tenant.v1.TenantService
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-User-Id
      backendRefs:
        - name: tenant-user
          port: {{ .Values.services.common.port }}
    # Project Service
    - matches:
        - path:
            type: PathPrefix
            value: /etalbaas.project.v1.ProjectService
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-User-Id
      backendRefs:
        - name: project
          port: {{ .Values.services.common.port }}
    # Secret Service (hosted by Project MS)
    - matches:
        - path:
            type: PathPrefix
            value: /etalbaas.secret.v1.SecretService
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-User-Id
      backendRefs:
        - name: project
          port: {{ .Values.services.common.port }}
    # Function Service
    - matches:
        - path:
            type: PathPrefix
            value: /etalbaas.function.v1.FunctionService
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-User-Id
      backendRefs:
        - name: function
          port: {{ .Values.services.common.port }}
    # Event Service
    - matches:
        - path:
            type: PathPrefix
            value: /etalbaas.event.v1.EventService
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-User-Id
      backendRefs:
        - name: event
          port: {{ .Values.services.common.port }}
    # Storage Service (gRPC: bucket management)
    - matches:
        - path:
            type: PathPrefix
            value: /etalbaas.storage.v1.StorageService
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-User-Id
      backendRefs:
        - name: storage
          port: {{ .Values.services.common.port }}
    # Storage Service (REST: dashboard file operations)
    - matches:
        - path:
            type: PathPrefix
            value: /storage/v1/dashboard
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-User-Id
      backendRefs:
        - name: storage
          port: {{ .Values.services.common.port }}
{{- end }}
