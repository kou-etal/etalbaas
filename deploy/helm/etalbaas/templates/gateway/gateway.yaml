{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: etalbaas-gateway
  namespace: {{ include "etalbaas.namespace" . }}
  labels:
    {{- include "etalbaas.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName | quote }}
  listeners:
    # HTTP → HTTPS redirect
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.listeners.http.port }}
      allowedRoutes:
        namespaces:
          from: All

    # HTTPS: wildcard *.api.{domain} (tenant APIs - PostgREST, Functions)
    - name: https-api-wildcard
      protocol: HTTPS
      port: {{ .Values.gateway.listeners.https.port }}
      hostname: "*.api.{{ include "etalbaas.baseDomain" . }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-api-tls
            namespace: {{ include "etalbaas.namespace" . }}
      allowedRoutes:
        namespaces:
          from: All

    # HTTPS: api.{domain} (dashboard management API)
    - name: https-api
      protocol: HTTPS
      port: {{ .Values.gateway.listeners.https.port }}
      hostname: "api.{{ include "etalbaas.baseDomain" . }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-api-tls
            namespace: {{ include "etalbaas.namespace" . }}
      allowedRoutes:
        namespaces:
          from: Same

    # HTTPS: dashboard.{domain}
    - name: https-dashboard
      protocol: HTTPS
      port: {{ .Values.gateway.listeners.https.port }}
      hostname: "dashboard.{{ include "etalbaas.baseDomain" . }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-api-tls
            namespace: {{ include "etalbaas.namespace" . }}
      allowedRoutes:
        namespaces:
          from: Same

    # HTTPS: auth.{domain} (GoTrue)
    {{- if .Values.gotrue.enabled }}
    - name: https-auth
      protocol: HTTPS
      port: {{ .Values.gateway.listeners.https.port }}
      hostname: "auth.{{ include "etalbaas.baseDomain" . }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-api-tls
            namespace: {{ include "etalbaas.namespace" . }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}

    # TLS Passthrough: *.db.{domain} (PostgreSQL SNI routing)
    - name: postgres-tls
      protocol: TLS
      port: {{ .Values.gateway.listeners.postgres.port }}
      hostname: "*.db.{{ include "etalbaas.baseDomain" . }}"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
