{{- if .Values.services.event.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event
  namespace: {{ include "etalbaas.namespace" . }}
  labels:
    {{- include "etalbaas.serviceLabels" (dict "root" . "component" "event") | nindent 4 }}
spec:
  replicas: {{ .Values.services.event.replicaCount | default .Values.services.common.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: event
      {{- include "etalbaas.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event
        app.kubernetes.io/component: event
        {{- include "etalbaas.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "etalbaas.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "etalbaas.podSecurityContext" . | nindent 8 }}
      containers:
        - name: event
          image: {{ include "etalbaas.imageRef" (dict "root" . "svc" "event" "name" "etalbaas-event") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.services.common.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.services.common.metricsPort }}
              protocol: TCP
          env:
            {{- include "etalbaas.commonEnv" . | nindent 12 }}
          securityContext:
            {{- include "etalbaas.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml (.Values.services.event.resources | default .Values.services.common.resources) | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: grpc
            initialDelaySeconds: 3
            periodSeconds: 10
{{- end }}
