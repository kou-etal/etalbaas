{{- if .Values.services.project.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: project-sa
  namespace: {{ include "etalbaas.namespace" . }}
  labels:
    {{- include "etalbaas.serviceLabels" (dict "root" . "component" "project") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "etalbaas.namespace" . }}-project
  labels:
    {{- include "etalbaas.serviceLabels" (dict "root" . "component" "project") | nindent 4 }}
rules:
  # Secrets: cluster-wide because project-ms manages secrets in per-project namespaces.
  # TODO: migrate to per-namespace Roles created dynamically by the operator.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["etalbaas.io"]
    resources: ["projects"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "etalbaas.namespace" . }}-project
  labels:
    {{- include "etalbaas.serviceLabels" (dict "root" . "component" "project") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "etalbaas.namespace" . }}-project
subjects:
  - kind: ServiceAccount
    name: project-sa
    namespace: {{ include "etalbaas.namespace" . }}
{{- end }}
