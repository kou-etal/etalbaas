{{- if .Values.services.storage.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storage-sa
  namespace: {{ include "etalbaas.namespace" . }}
  labels:
    {{- include "etalbaas.serviceLabels" (dict "root" . "component" "storage") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "etalbaas.namespace" . }}-storage
  labels:
    {{- include "etalbaas.serviceLabels" (dict "root" . "component" "storage") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "etalbaas.namespace" . }}-storage
  labels:
    {{- include "etalbaas.serviceLabels" (dict "root" . "component" "storage") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "etalbaas.namespace" . }}-storage
subjects:
  - kind: ServiceAccount
    name: storage-sa
    namespace: {{ include "etalbaas.namespace" . }}
{{- end }}
