syntax = "proto3";

package etalbaas.tenant.v1;

option go_package = "github.com/kou-etal/etalbaas/gen/go/etalbaas/tenant/v1;tenantv1";

import "google/protobuf/timestamp.proto";
import "etalbaas/common/v1/common.proto";

//tenantは認証。supabaseのgotrue使う。

//ハッカソン用途でrefreshtokenとupdate削る。
//TODO:gotrueのtoken期限は60分やから延ばす。
service TenantUserService {
  rpc SignUp(SignUpRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc GetMe(etalbaas.common.v1.Empty) returns (TenantUser);
}



message SignUpRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  TenantUser user = 4;
}

message TenantUser {
  string id = 1;
  string email = 2;
  string display_name = 3;
  string namespace = 4;
  google.protobuf.Timestamp created_at = 5;
}
