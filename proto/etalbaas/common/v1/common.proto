syntax = "proto3";

package etalbaas.common.v1;

option go_package = "github.com/kou-etal/etalbaas/gen/go/etalbaas/common/v1;commonv1";

import "google/protobuf/timestamp.proto";

// Empty is a placeholder for requests/responses with no fields.
message Empty {}

// Pagination for list requests.
message PaginationRequest {
  int32 page = 1;
  int32 per_page = 2;
}

message PaginationResponse {
  int32 total = 1;
  int32 page = 2;
  int32 per_page = 3;
  int32 total_pages = 4;
}
