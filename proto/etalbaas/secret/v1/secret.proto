syntax = "proto3";

package etalbaas.secret.v1;

option go_package = "github.com/kou-etal/etalbaas/proto/gen/go/etalbaas/secret/v1;secretv1";

import "google/protobuf/timestamp.proto";
import "etalbaas/common/v1/common.proto";

// SecretService は Function 用の外部 API キー・トークンの管理を担当。
// Secret の値は k8s Secret にのみ保存し、メタDB には名前とメタ情報のみ保持。
// GetSecret RPC は作らない（値の取り出し経路を型レベルで遮断）。
service SecretService {
  // Secret メタ情報登録 + k8s Secret 作成。
  // value はリクエストでのみ送信、レスポンス・一覧には含まれない。
  // Errors: NOT_FOUND (project), ALREADY_EXISTS (name重複)
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);

  // Secret メタ情報一覧（値は含まない）。
  // Errors: NOT_FOUND (project)
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

  // Secret の値を更新（ローテーション）。メタ情報（name/description）は変更しない。
  // name 変更 RPC は作らない（env_vars.secret_name 参照が壊れるため）。
  // Errors: NOT_FOUND
  rpc UpdateSecretValue(UpdateSecretValueRequest) returns (UpdateSecretValueResponse);

  // Secret 削除（メタDB + k8s Secret 両方削除）。
  // Phase 1: 参照中の Secret も削除可能（Function は次回起動時にエラー）。
  // Phase 2 で参照チェック追加検討（FAILED_PRECONDITION）。
  // Errors: NOT_FOUND
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
}

// Secret メタ情報。値は含めない設計。
message SecretMetadata {
  // output_only
  string id = 1;
  // output_only
  string project_id = 2;
  // Secret 名 = 環境変数名。プロジェクト内一意。最大64文字。
  // 英大文字・数字・アンダースコア（例: "OPENAI_API_KEY", "STRIPE_WEBHOOK_SECRET"）。
  // Function の env_vars で secret_name として参照される。
  // k8s Secret 名への変換（DNS-1123: 小文字+ハイフン）はサーバー側で自動実行。
  // 変更不可（参照の安定性のため）。変更したい場合は新規作成して移行。
  string name = 3;
  // 最大1024文字。
  string description = 4;
  // output_only
  google.protobuf.Timestamp created_at = 5;
  // output_only
  google.protobuf.Timestamp updated_at = 6;
}

message CreateSecretRequest {
  string project_id = 1;
  // Secret 名 = 環境変数名。プロジェクト内一意。最大64文字。
  // 英大文字・数字・アンダースコア（例: "OPENAI_API_KEY"）。
  // k8s Secret 名への変換はサーバー側で自動実行。
  string name = 2;
  // Secret の値（k8s Secret に保存、メタDB には入らない）。
  // このフィールドは書き込み専用。取得系 RPC では返されない。
  // 空文字はバリデーションエラー（INVALID_ARGUMENT）。
  string value = 3;
  // 最大1024文字。
  string description = 4;
}

message CreateSecretResponse {
  SecretMetadata secret = 1;
}

message ListSecretsRequest {
  string project_id = 1;
  etalbaas.common.v1.PaginationRequest pagination = 2;
}

message ListSecretsResponse {
  repeated SecretMetadata secrets = 1;
  etalbaas.common.v1.PaginationResponse pagination = 2;
}

// 値のみ更新（ローテーション用）。
message UpdateSecretValueRequest {
  string project_id = 1;
  string secret_id = 2;
  // 新しい値。k8s Secret を更新。
  // 空文字はバリデーションエラー（INVALID_ARGUMENT）。
  string value = 3;
}

message UpdateSecretValueResponse {
  // updated_at が更新された SecretMetadata を返す。
  SecretMetadata secret = 1;
}

message DeleteSecretRequest {
  string project_id = 1;
  string secret_id = 2;
}

message DeleteSecretResponse {
  SecretMetadata secret = 1;
}
