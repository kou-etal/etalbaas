syntax = "proto3";

package etalbaas.invoke.v1;

option go_package = "github.com/kou-etal/etalbaas/gen/go/etalbaas/invoke/v1;invokev1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "etalbaas/common/v1/common.proto";


service InvokeService {
  rpc InvokeFunction(InvokeFunctionRequest) returns (InvokeFunctionResponse);
  rpc InvokeFunctionStream(InvokeFunctionRequest) returns (stream InvocationEvent);
  rpc ListInvocations(ListInvocationsRequest) returns (ListInvocationsResponse);
  rpc GetInvocationLogs(GetInvocationLogsRequest) returns (stream LogLine);
}

enum InvocationMode {
  INVOCATION_MODE_UNSPECIFIED = 0;
  INVOCATION_MODE_SYNC = 1;
  INVOCATION_MODE_ASYNC = 2;
  INVOCATION_MODE_STREAM = 3;
}

message InvokeFunctionRequest {
  string project_id = 1;
  string function_name = 2;
  InvocationMode mode = 3;
  google.protobuf.Struct payload = 4;
}

message InvokeFunctionResponse {
  string invocation_id = 1;
  InvocationStatus status = 2;
  google.protobuf.Struct result = 3;
}

enum InvocationStatus {
  INVOCATION_STATUS_UNSPECIFIED = 0;
  INVOCATION_STATUS_PENDING = 1;
  INVOCATION_STATUS_RUNNING = 2;
  INVOCATION_STATUS_COMPLETED = 3;
  INVOCATION_STATUS_FAILED = 4;
}

message InvocationEvent {
  string invocation_id = 1;
  InvocationStatus status = 2;
  string message = 3;
  google.protobuf.Struct data = 4;
  google.protobuf.Timestamp timestamp = 5;
}

message ListInvocationsRequest {
  string project_id = 1;
  string function_name = 2;
  etalbaas.common.v1.PaginationRequest pagination = 3;
}

message ListInvocationsResponse {
  repeated Invocation invocations = 1;
  etalbaas.common.v1.PaginationResponse pagination = 2;
}

message Invocation {
  string id = 1;
  string function_name = 2;
  InvocationStatus status = 3;
  int64 duration_ms = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
}

message GetInvocationLogsRequest {
  string invocation_id = 1;
  string project_id = 2;
}

message LogLine {
  google.protobuf.Timestamp timestamp = 1;
  string level = 2;
  string message = 3;
}
