services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: etalbaas
      POSTGRES_PASSWORD: etalbaas
      POSTGRES_DB: etalbaas_meta
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etalbaas"]
      interval: 2s
      timeout: 3s
      retries: 15

  nats:
    image: nats:2-alpine
    command: ["--jetstream"]
    ports:
      - "4222:4222"

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: migrate/migrate:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../deploy/migrations/meta:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://etalbaas:etalbaas@postgres:5432/etalbaas_meta?sslmode=disable"
      - "up"

  tenant-user:
    build:
      context: ../..
      dockerfile: services/tenant-user/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://etalbaas:etalbaas@postgres:5432/etalbaas_meta?sslmode=disable
      PORT: "8080"
      METRICS_PORT: "9090"
      JWT_SECRET: e2e-test-secret
      ENV: development
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 10

  project:
    build:
      context: ../..
      dockerfile: services/project/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://etalbaas:etalbaas@postgres:5432/etalbaas_meta?sslmode=disable
      PORT: "8080"
      METRICS_PORT: "9090"
      JWT_SECRET: e2e-test-secret
      K8S_ENABLED: "false"
      ENV: development
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 10

  function:
    build:
      context: ../..
      dockerfile: services/function/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://etalbaas:etalbaas@postgres:5432/etalbaas_meta?sslmode=disable
      PORT: "8080"
      METRICS_PORT: "9090"
      JWT_SECRET: e2e-test-secret
      K8S_ENABLED: "false"
      ENV: development
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 10

  event:
    build:
      context: ../..
      dockerfile: services/event/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://etalbaas:etalbaas@postgres:5432/etalbaas_meta?sslmode=disable
      PORT: "8080"
      METRICS_PORT: "9090"
      JWT_SECRET: e2e-test-secret
      ENV: development
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 10

  storage:
    build:
      context: ../..
      dockerfile: services/storage/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://etalbaas:etalbaas@postgres:5432/etalbaas_meta?sslmode=disable
      PORT: "8080"
      METRICS_PORT: "9090"
      JWT_SECRET: e2e-test-secret
      K8S_ENABLED: "false"
      S3_ENDPOINT: minio:9000
      S3_BUCKET: etalbaas-storage
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      ENV: development
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 10
