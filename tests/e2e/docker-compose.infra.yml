services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: etalbaas
      POSTGRES_PASSWORD: etalbaas
      POSTGRES_DB: etalbaas_meta
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etalbaas"]
      interval: 2s
      timeout: 3s
      retries: 15

  nats:
    image: nats:2-alpine
    command: ["--jetstream"]
    ports:
      - "4222:4222"

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: migrate/migrate:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../deploy/migrations/meta:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://etalbaas:etalbaas@postgres:5432/etalbaas_meta?sslmode=disable"
      - "up"
