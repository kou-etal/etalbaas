---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: projects.etalbaas.io
spec:
  group: etalbaas.io
  names:
    kind: Project
    listKind: ProjectList
    plural: projects
    singular: project
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.plan
      name: Plan
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Project is the Schema for the projects API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ProjectSpec defines the desired state of a Project.
            properties:
              description:
                description: Description is an optional description of the project.
                type: string
              displayName:
                description: DisplayName is the human-readable name of the project.
                maxLength: 100
                type: string
              lifecycle:
                description: Lifecycle defines the project lifecycle mode.
                properties:
                  mode:
                    default: persistent
                    description: Mode is the lifecycle mode.
                    enum:
                    - persistent
                    - ephemeral
                    - evolutionary
                    type: string
                required:
                - mode
                type: object
              networking:
                description: Networking defines the networking configuration.
                properties:
                  dbSubdomain:
                    description: DbSubdomain is the subdomain for the database endpoint.
                    type: string
                  subdomain:
                    description: Subdomain is the subdomain for the API endpoint (e.g.,
                      "xk7a9bc2").
                    type: string
                required:
                - subdomain
                type: object
              plan:
                default: free
                description: Plan is the billing plan for this project.
                enum:
                - free
                - pro
                - enterprise
                type: string
              stack:
                description: Stack defines the infrastructure components to provision.
                properties:
                  postgres:
                    description: Postgres defines the PostgreSQL configuration.
                    properties:
                      enabled:
                        description: Enabled indicates whether PostgreSQL is provisioned.
                        type: boolean
                      extensions:
                        description: Extensions is a list of PostgreSQL extensions
                          to enable.
                        items:
                          type: string
                        type: array
                      pooler:
                        description: Pooler defines the connection pooler configuration.
                        properties:
                          enabled:
                            description: Enabled indicates whether the connection
                              pooler is provisioned.
                            type: boolean
                          instances:
                            default: 2
                            description: Instances is the number of pooler instances.
                            format: int32
                            type: integer
                        required:
                        - enabled
                        type: object
                      replicas:
                        default: 2
                        description: Replicas is the number of PostgreSQL instances
                          (Primary + Replicas).
                        format: int32
                        minimum: 1
                        type: integer
                      resources:
                        description: Resources defines the CPU and memory resources
                          for PostgreSQL.
                        properties:
                          cpu:
                            description: CPU is the CPU resource (e.g., "500m").
                            type: string
                          memory:
                            description: Memory is the memory resource (e.g., "1Gi").
                            type: string
                        type: object
                      storage:
                        default: 10Gi
                        description: Storage is the storage size for the PostgreSQL
                          cluster.
                        type: string
                      version:
                        default: "16"
                        description: Version is the PostgreSQL major version.
                        type: string
                    required:
                    - enabled
                    type: object
                  postgrest:
                    description: PostgREST defines the PostgREST configuration.
                    properties:
                      anonRole:
                        default: anon
                        description: AnonRole is the PostgreSQL role used for anonymous
                          access.
                        type: string
                      enabled:
                        description: Enabled indicates whether PostgREST is provisioned.
                        type: boolean
                    required:
                    - enabled
                    type: object
                  redis:
                    description: Redis defines the Redis configuration.
                    properties:
                      enabled:
                        description: Enabled indicates whether Redis is provisioned.
                        type: boolean
                      persistence:
                        description: Persistence indicates whether Redis data is persisted.
                        type: boolean
                    required:
                    - enabled
                    type: object
                type: object
            required:
            - displayName
            - networking
            - plan
            - stack
            type: object
          status:
            description: ProjectStatus defines the observed state of a Project.
            properties:
              apiKeys:
                description: ApiKeys contains references to the provisioned API keys.
                items:
                  description: ApiKeyRef is a reference to a provisioned API key.
                  properties:
                    id:
                      description: ID is the API key identifier.
                      type: string
                    name:
                      description: Name is the API key name (e.g., "default-service-role").
                      type: string
                  required:
                  - id
                  - name
                  type: object
                type: array
              components:
                description: Components contains the status of each infrastructure
                  component.
                properties:
                  cdc:
                    description: CDC is the status of the CDC Pod component.
                    properties:
                      status:
                        description: Status is the component status (e.g., "Ready",
                          "Provisioning", "Failed").
                        type: string
                    type: object
                  gotrue:
                    description: GoTrue is the status of the GoTrue auth component.
                    properties:
                      status:
                        description: Status is the component status (e.g., "Ready",
                          "Provisioning", "Failed").
                        type: string
                    type: object
                  postgres:
                    description: Postgres is the status of the PostgreSQL component.
                    properties:
                      poolerEndpoint:
                        description: PoolerEndpoint is the connection pooler endpoint.
                        type: string
                      primaryEndpoint:
                        description: PrimaryEndpoint is the primary PostgreSQL endpoint.
                        type: string
                      status:
                        description: Status is the component status.
                        type: string
                    type: object
                  postgresMeta:
                    description: PostgresMeta is the status of the postgres-meta component.
                    properties:
                      status:
                        description: Status is the component status (e.g., "Ready",
                          "Provisioning", "Failed").
                        type: string
                    type: object
                  postgrest:
                    description: PostgREST is the status of the PostgREST component.
                    properties:
                      status:
                        description: Status is the component status (e.g., "Ready",
                          "Provisioning", "Failed").
                        type: string
                    type: object
                  redis:
                    description: Redis is the status of the Redis component.
                    properties:
                      status:
                        description: Status is the component status (e.g., "Ready",
                          "Provisioning", "Failed").
                        type: string
                    type: object
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the project's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endpoints:
                description: Endpoints contains the provisioned endpoints.
                properties:
                  authApi:
                    description: AuthApi is the GoTrue auth API endpoint URL.
                    type: string
                  dbConnectionString:
                    description: DbConnectionString is the full database connection
                      string.
                    type: string
                  dbHost:
                    description: DbHost is the database host for direct connections.
                    type: string
                  restApi:
                    description: RestApi is the REST API endpoint URL.
                    type: string
                  storageApi:
                    description: StorageApi is the storage API endpoint URL.
                    type: string
                type: object
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed.
                format: int64
                type: integer
              phase:
                description: Phase is the current phase of the project.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Failed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
