name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.work.sum

      - uses: bufbuild/buf-setup-action@v1

      - name: Buf lint
        run: cd proto && buf lint

      - name: Generate proto
        run: cd proto && buf generate

      - name: Run tests (workspace)
        run: |
          grep -oP '^\t\./\K\S+' go.work | while read -r dir; do
            echo "==> Testing $dir"
            output=$( cd "$dir" && go test ./... 2>&1 ) && echo "$output" || {
              if echo "$output" | grep -q "matched no packages"; then
                echo "  (no test packages, skipping)"
              else
                echo "$output"
                exit 1
              fi
            }
          done

  build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: etalbaas-tenant-user
            dockerfile: services/tenant-user/Dockerfile
            context: .
          - name: etalbaas-project
            dockerfile: services/project/Dockerfile
            context: .
          - name: etalbaas-function
            dockerfile: services/function/Dockerfile
            context: .
          - name: etalbaas-event
            dockerfile: services/event/Dockerfile
            context: .
          - name: etalbaas-storage
            dockerfile: services/storage/Dockerfile
            context: .
          - name: etalbaas-operator
            dockerfile: operator/Dockerfile
            context: .
          - name: etalbaas-gpu-dispatcher
            dockerfile: operator/Dockerfile.dispatcher
            context: .
          - name: etalbaas-cdc-pod
            dockerfile: services/cdc-pod/Dockerfile
            context: services/cdc-pod
          - name: etalbaas-nats-sidecar
            dockerfile: services/nats-sidecar/Dockerfile
            context: services/nats-sidecar
          - name: etalbaas-dashboard
            dockerfile: dashboard/Dockerfile
            context: .
            build-args: |
              NEXT_PUBLIC_API_URL=https://api.${{ vars.ETALBAAS_DOMAIN || 'etalbaas.example.com' }}
              NEXT_PUBLIC_GOTRUE_URL=https://auth.${{ vars.ETALBAAS_DOMAIN || 'etalbaas.example.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/kou-etal/${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
